server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
